
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CampusConnect</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">

  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">

  <div class="login-layout">

    <!-- Navigation -->
    <header class="login-navbar">
      <a href="index.html" class="login-logo">
        <span class="logo-icon">✉</span>
        <span>Campus<span class="brand-accent">Connect</span></span>
      </a>

      <!-- <nav class="login-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#features">Events</a>
        <a href="index.html#features">Assignments</a>
        <a href="index.html#features">About</a>
      </nav> -->

      <a href="register.html" class="register-link">Register</a>
    </header>

    <main class="login-main">

      <!-- Left illustration section -->
      <section class="campus-panel" aria-label="CampusConnect introduction">

        <div class="campus-image">
          <!-- We will insert our Figma illustration here -->
        </div>

        <span class="campus-status">
          <span class="status-dot"></span>
          Campus Life Active
        </span>

        <span class="campus-tagline">
          Better Campus Together
        </span>

        <div class="campus-content">
          <!-- <span class="student-count">
            10,000+ Students Connected
          </span> -->

          <h1>Connect. Learn. Grow.</h1>

          <!-- <p>
            Your all-in-one hub for campus events,
            assignments, and student community life.
          </p> -->
        </div>
      </section>

      <!-- Right login form -->
      <section class="login-card" aria-labelledby="login-heading">

        <h2 id="login-heading">Welcome Back!</h2>
        <p class="login-subtitle">Login to continue your journey</p>

        <form id="loginForm">

          <fieldset class="role-selector">
            <legend class="sr-only">Select your role</legend>

            <label class="role-option">
              <input type="radio" name="role" value="student" checked>
              <span>Student</span>
            </label>

            <label class="role-option">
              <input type="radio" name="role" value="teacher">
              <span>Teacher</span>
            </label>

            <label class="role-option">
              <input type="radio" name="role" value="admin">
              <span>Admin</span>
            </label>
          </fieldset>

          <div class="form-group">
            <label class="sr-only" for="loginEmail">Email Address</label>

            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="Email Address"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label class="sr-only" for="loginPassword">Password</label>

            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              Remember Me
            </label>

            <a href="#" class="forgot-password">
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="login-submit">
            Login →
          </button>

          <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>

        </form>

        <div class="login-divider">
          <span>OR</span>
        </div>

        <button type="button" class="google-login" disabled title="Google sign-in is not configured yet">
          Continue with Google
        </button>

        <p class="signup-text">
          Don't have an account?
          <a href="register.html">Register</a>
        </p>

      </section>

    </main>
  </div>

</body>
</html>
