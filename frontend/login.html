
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CampusConnect</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">

  <script src="js/config.js" defer></script>
<script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">

  <div class="login-layout">

    
    <header class="login-navbar">
      <a href="index.html" class="login-logo">
        <span class="logo-icon">✉</span>
        <span>Campus<span class="brand-accent">Connect</span></span>
      </a>

      

      <a href="register.html" class="register-link">Register</a>
    </header>

    <main class="login-main">

      
      <section class="campus-panel" aria-label="CampusConnect introduction">

        <div class="campus-image">
          
        </div>

        <span class="campus-status">
          <span class="status-dot"></span>
          Campus Life Active
        </span>

        <span class="campus-tagline">
          Better Campus Together
        </span>

        <div class="campus-content">
          

          <h1>Connect. Learn. Grow.</h1>

          
        </div>
      </section>

      
      <section class="login-card" aria-labelledby="login-heading">

        <h2 id="login-heading">Welcome Back!</h2>
        <p class="login-subtitle">Login to continue your journey</p>

        <form id="loginForm">

          <p class="login-subtitle">For students, teachers, and administrators.</p>

          <div class="form-group">
            <label class="sr-only" for="loginEmail">Email Address</label>

            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="Email Address"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label class="sr-only" for="loginPassword">Password</label>

            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            >
          </div>

          <p class="login-subtitle">Need password recovery? Contact your campus administrator.</p>

          <button type="submit" class="login-submit">
            Login →
          </button>

          <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>

        </form>

        <div class="login-divider">
          <span>OR</span>
        </div>

        <button type="button" class="google-login" disabled title="Google sign-in is not configured yet">
          Continue with Google
        </button>

        <p class="signup-text">
          Don't have an account?
          <a href="register.html">Register</a>
        </p>

      </section>

    </main>
  </div>

</body>
</html>
